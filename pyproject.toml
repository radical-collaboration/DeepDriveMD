[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ddmd"
version = "1.0.0"
description = "DeepDriveMD framework"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
requires-python = ">=3.6"
dependencies = [
    "numpy",
    "radical.asyncflow",
]

[tool.setuptools.packages.find]
where = ["ddmd"]
exclude = ["tests*", "docs*"]
